<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A2E"/>
      <stop offset="100%" stop-color="#0E2D1B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D080"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Background card with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Inner gold accent border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Classical Guitar & Trova Emblem -->
  <g transform="translate(256, 240)">
    <!-- Tuning Pegs & Headstock -->
    <path d="M-12 -145 L12 -145 L16 -105 L-16 -105 Z" fill="url(#goldGrad)"/>
    <circle cx="-22" cy="-135" r="5.5" fill="url(#goldGrad)"/>
    <circle cx="22" cy="-135" r="5.5" fill="url(#goldGrad)"/>
    <circle cx="-22" cy="-118" r="5.5" fill="url(#goldGrad)"/>
    <circle cx="22" cy="-118" r="5.5" fill="url(#goldGrad)"/>

    <!-- Neck & Frets -->
    <rect x="-9" y="-105" width="18" height="80" fill="url(#goldGrad)"/>
    <line x1="-9" y1="-85" x2="9" y2="-85" stroke="#1A4A2E" stroke-width="2.5"/>
    <line x1="-9" y1="-65" x2="9" y2="-65" stroke="#1A4A2E" stroke-width="2.5"/>
    <line x1="-9" y1="-45" x2="9" y2="-45" stroke="#1A4A2E" stroke-width="2.5"/>

    <!-- Guitar Body Contour -->
    <path d="M 0 -25
             C -45 -25, -68 5, -68 42
             C -68 68, -46 82, -36 96
             C -22 110, -48 126, -58 142
             C -72 164, -62 195, -36 205
             C -16 212, 16 212, 36 205
             C 62 195, 72 164, 58 142
             C 48 126, 22 110, 36 96
             C 46 82, 68 68, 68 42
             C 68 5, 45 -25, 0 -25 Z" 
          fill="url(#goldGrad)"/>

    <!-- Soundhole Ring & Rosette -->
    <circle cx="0" cy="42" r="27" fill="#1A4A2E"/>
    <circle cx="0" cy="42" r="23.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="42" r="18" fill="#0E2D1B"/>

    <!-- Bridge & Saddle -->
    <rect x="-26" y="152" width="52" height="14" rx="4" fill="#1A4A2E"/>
    <rect x="-20" y="156" width="40" height="6" rx="2" fill="url(#goldGrad)"/>
  </g>
</svg>
